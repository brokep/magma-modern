# Fail2Ban filter for Magma — matches the per-attempt auth-failure line that
# magmad writes for SMTP, POP and IMAP logins, e.g.
#
#   [12:34:56 - smtp.c - smtp_auth_plain() - 327] Failed login attempt. { ip = 203.0.113.9 / username = bob / protocol = SMTP }
#
# Magma stamps each line with HH:MM:SS only; the date comes from the daily log
# file name (magmad.<YYYYMMDD>.log), so we anchor the time and let the jail map
# it onto the file's day.
#
# Install: copy to /etc/fail2ban/filter.d/magma.conf (the host installer does
# this for you) and enable the [magma] jail. Test with:
#   fail2ban-regex /var/log/magma/magmad.$(date +%Y%m%d).log /etc/fail2ban/filter.d/magma.conf
[Definition]
datepattern = ^\[%H:%M:%S
failregex = ^.*Failed login attempt\. \{ ip = <HOST> / username = .* / protocol = (?:SMTP|POP|IMAP) \}\s*$
ignoreregex =
